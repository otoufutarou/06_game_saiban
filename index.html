<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d5eff4">
  <title>天国審査</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <div id="viewport">
    <main id="game" aria-label="天国審査">
      <div id="scene"></div>
    </main>
  </div>
  <dialog id="confirmation" aria-labelledby="confirmation-title">
    <h2 id="confirmation-title"></h2>
    <div class="dialog-actions">
      <button id="confirm-yes">はい</button>
      <button id="confirm-no">考え直す</button>
    </div>
  </dialog>
  <p id="notice" role="status" aria-live="polite"></p>
  <noscript>このゲームには JavaScript が必要です。</noscript>
</body>
</html>
